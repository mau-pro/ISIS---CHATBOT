# I-SIS completo con un solo comando:   docker compose up -d --build
#
#   db        PostgreSQL 16 (cuentas, historial y registro de documentos)
#   backend   FastAPI + OCR (Tesseract) + búsqueda (ChromaDB)
#   frontend  nginx: sirve la web y reenvía /api al backend (puerto 80)
#
# Variables: copiá .env.docker.example a .env (en esta carpeta) y completalo;
# las claves del backend (Groq, JWT, SMTP) van en backend/.env.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asistente
      POSTGRES_USER: isis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isis -d asistente"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin "ports": la base NO se expone a internet, solo la ve el backend por la red interna

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Lo que está acá pisa lo de backend/.env: dentro de Docker la base es el servicio "db"
      DATABASE_URL: postgresql://isis:${POSTGRES_PASSWORD}@db:5432/asistente
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost}
      BACKEND_URL: ${PUBLIC_URL:-http://localhost}/api
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads            # archivos originales subidos por el admin
      - chroma:/app/chroma_data         # índice de búsqueda (se puede reconstruir desde uploads)
      - modelo_embeddings:/root/.cache/chroma   # modelo de búsqueda (se descarga una sola vez)
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  uploads:
  chroma:
  modelo_embeddings:
