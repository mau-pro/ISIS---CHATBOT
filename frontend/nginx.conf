server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Subida de documentos (el backend limita a 15 MB por archivo)
    client_max_body_size 20m;

    # La API: /api/chat -> backend:8000/chat (se quita el prefijo /api)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Una consulta con IA puede tardar unos segundos (reintentos por límite de uso)
        proxy_read_timeout 90s;
    }

    # Archivos estáticos con caché larga (los nombres llevan hash)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier ruta (/chat, /admin, /login...) devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
